<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paragraph Colors</title>
</head>
<body>

    <p id="yellow" style="background-color: yellow; border: 1px solid green;">
        Yellow Paragraph
    </p>

    <p id="red" style="background-color: red; border: 1px solid black;">
        Red Paragraph
    </p>

    <p id="green" style="background-color: green; border: 1px solid yellow;">
        Green Paragraph
    </p>

</body>
</html>
